<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/index.css" />
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Hero -->
    <section class="hero">
        <div class="container-fluid hero-container">
            <div class="hero-text">
                <h1>
                    O <strong>ControleCerto</strong> é o
                    <span class="highlight">certo</span>
                    para você e a sua empresa.
                </h1>
                <p>O software financeiro completo para empresas que querem performance e controle real.</p>
                <a href="#" class="btn-saiba">Saiba mais</a>
            </div>
            <div class="hero-image">
                <img src="../assets/imgs/pessoa_landing.png" alt="Executivo com laptop" />
            </div>
        </div>
        <div class="divider-line"></div>
    </section>

    <!-- Dashboard -->
    <section class="dashboard">
        <div class="container-fluid dashboard-container">
            <img src="../assets/imgs/note_landing.png" alt="Dashboard ControleCerto" class="dashboard-img" />
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js"></script>
    <script src="../scripts/components.js"></script>
</body>

</html>
