<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato – ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/contato.css" />
</head>

<body>

    <!-- Navbar -->
    <header class="navbar-wrapper">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid nav-container">

                <a href="index.html" class="navbar-brand">
                    <img src="../assets/imgs/logo.png" alt="ControleCerto" class="nav-logo" />
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav me-auto nav-links">
                        <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
                        <li class="nav-item"><a href="sobre.html" class="nav-link">Sobre</a></li>
                        <li class="nav-item"><a href="contato.html" class="nav-link active">Contato</a></li>
                    </ul>
                    <div class="nav-actions">
                        <a href="#" class="btn-start">Começar</a>
                        <a href="#" class="btn-demo">Demonstração</a>
                    </div>
                </div>

            </div>
        </nav>
        <div class="divider-line"></div>
    </header>

    <!-- Formulário -->
    <section class="contato">
        <h2 class="contato-titulo">Fale Conosco</h2>

        <div class="contato-form">
            <select class="campo-select">
                <option value="" disabled selected>Assunto</option>
                <option value="suporte">Suporte</option>
                <option value="comercial">Comercial</option>
                <option value="financeiro">Financeiro</option>
                <option value="outro">Outro</option>
            </select>

            <textarea class="campo-textarea" placeholder="Mensagem" rows="8"></textarea>

            <button class="btn-enviar">Enviar</button>
        </div>
    </section>

    <!-- Rodapé -->
    <div class="divider-line"></div>

    <footer class="rodape">
        <div class="rodape-container">
            <div class="rodape-slogan">
                <h3>
                    O <strong>ControleCerto</strong> é o
                    <span class="highlight">certo</span>
                    para você e a sua empresa.
                </h3>
            </div>
            <div class="rodape-desc">
                <p>O software financeiro completo para empresas que querem performance e controle real.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/script.js"></script>
</body>

</html>
