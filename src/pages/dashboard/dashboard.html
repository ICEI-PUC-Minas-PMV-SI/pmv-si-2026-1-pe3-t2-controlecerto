<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visão Geral — ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="../../styles/dashboard.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <header class="page-header">
                <h1 class="page-header__title">Visão Geral</h1>
            </header>

            <section class="dashboard-overview__grid" aria-label="Resumo financeiro">
                <article class="finance-card finance-card--revenue">
                    <h2 class="finance-card__label">Receitas</h2>
                    <p class="finance-card__value finance-card__value--revenue" id="total-receitas">R$ 0,00</p>
                    <p class="finance-card__subtitle">Total acumulado</p>
                    <div class="finance-card__chart">
                        <svg class="chart-bars" id="chart-receitas" viewBox="0 0 480 180" role="img"
                            aria-label="Gráfico de barras das receitas por mês">
                        </svg>
                    </div>
                </article>

                <article class="finance-card finance-card--expense">
                    <h2 class="finance-card__label">Despesas</h2>
                    <p class="finance-card__value finance-card__value--expense" id="total-despesas">R$ 0,00</p>
                    <p class="finance-card__subtitle">Total acumulado</p>
                    <div class="finance-card__chart">
                        <svg class="chart-line" id="chart-despesas" viewBox="0 0 480 180" role="img"
                            aria-label="Gráfico de linha das despesas por mês" overflow="visible">
                        </svg>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/sidebar.js"></script>
    <script src="../../scripts/db.js"></script>
    <script src="../../scripts/dashboard.js"></script>
</body>

</html>
