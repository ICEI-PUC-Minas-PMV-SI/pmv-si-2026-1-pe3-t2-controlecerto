        <main class="main-content">
            <header class="page-header">
                <h1 class="page-header__title">Despesas</h1>
            </header>

            <section class="page-content" aria-label="Listagem de despesas">
                <div class="panel-table">
                    <table class="panel-table__table">
                        <thead>
                            <tr>
                                <th scope="col">Descrição</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Data</th>
                                <th scope="col">Valor (R$)</th>
                                <th scope="col"><span class="visually-hidden">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-despesas">
                        </tbody>
                    </table>
                </div>
            </section>

            <button type="button" class="fab" id="btn-adicionar" aria-label="Adicionar despesa">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
        </main>

    <!-- Adicionar / Editar -->
    <div class="modal fade" id="modalDespesa" tabindex="-1" aria-labelledby="modalDespesaTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-cc">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalDespesaTitulo">Nova Despesa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="despesa-id" />
                    <input type="text" id="despesa-descricao" class="campo-modal mb-3" placeholder="Descrição" />
                    <input type="text" id="despesa-categoria" class="campo-modal mb-3" placeholder="Categoria" />
                    <input type="date" id="despesa-data" class="campo-modal mb-3" />
                    <input type="number" id="despesa-valor" class="campo-modal mb-3" placeholder="Valor (R$)" min="0"
                        step="0.01" />
                    <p class="erro-modal" id="erro-modal"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-save" id="btn-salvar">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmar exclusão -->
    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content modal-cc">
                <div class="modal-header">
                    <h5 class="modal-title">Excluir despesa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <p class="modal-confirm-text">Tem certeza que deseja excluir esta despesa?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-delete" id="btn-confirmar-exclusao">Excluir</button>
                </div>
            </div>
        </div>
    </div>
