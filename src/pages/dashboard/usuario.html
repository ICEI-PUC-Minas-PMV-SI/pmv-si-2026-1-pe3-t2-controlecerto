<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Perfil — ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="../../styles/usuario.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <header class="page-header">
                <h1 class="page-header__title">Dados do Usuário</h1>
            </header>

            <section class="perfil-cards" aria-label="Informações do usuário">
                <div class="perfil-card">
                    <span class="perfil-card__label">Nome:</span>
                    <span class="perfil-card__valor" id="perfil-nome">—</span>
                </div>
                <div class="perfil-card">
                    <span class="perfil-card__label">CPF:</span>
                    <span class="perfil-card__valor" id="perfil-cpf">—</span>
                </div>
                <div class="perfil-card">
                    <span class="perfil-card__label">E-mail:</span>
                    <span class="perfil-card__valor" id="perfil-email">—</span>
                </div>
                <div class="perfil-card">
                    <span class="perfil-card__label">Empresa:</span>
                    <span class="perfil-card__valor" id="perfil-empresa">—</span>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/sidebar.js"></script>
    <script src="../../scripts/db.js"></script>
    <script src="../../scripts/usuario.js"></script>
</body>

</html>
