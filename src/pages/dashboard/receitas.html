<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receitas — ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="../../styles/receitas.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <header class="page-header">
                <h1 class="page-header__title">Receitas</h1>
            </header>

            <section class="page-content" aria-label="Listagem de receitas">
                <div class="panel-table">
                    <table class="panel-table__table">
                        <thead>
                            <tr>
                                <th scope="col">Descrição</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Data</th>
                                <th scope="col">Valor (R$)</th>
                                <th scope="col"><span class="visually-hidden">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-receitas">
                        </tbody>
                    </table>
                </div>
            </section>

            <button type="button" class="fab" id="btn-adicionar" aria-label="Adicionar receita">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
        </main>
    </div>

    <!-- Adicionar / Editar -->
    <div class="modal fade" id="modalReceita" tabindex="-1" aria-labelledby="modalReceitaTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-cc">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalReceitaTitulo">Nova Receita</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="receita-id" />
                    <input type="text" id="receita-descricao" class="campo-modal mb-3" placeholder="Descrição" />
                    <input type="text" id="receita-categoria" class="campo-modal mb-3" placeholder="Categoria" />
                    <input type="date" id="receita-data" class="campo-modal mb-3" />
                    <input type="number" id="receita-valor" class="campo-modal mb-3" placeholder="Valor (R$)" min="0"
                        step="0.01" />
                    <p class="erro-modal" id="erro-modal"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-save" id="btn-salvar">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmar exclusão -->
    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content modal-cc">
                <div class="modal-header">
                    <h5 class="modal-title">Excluir receita</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <p class="modal-confirm-text">Tem certeza que deseja excluir esta receita?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-delete" id="btn-confirmar-exclusao">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/sidebar.js"></script>
    <script src="../../scripts/db.js"></script>
    <script src="../../scripts/receitas.js"></script>
</body>

</html>
