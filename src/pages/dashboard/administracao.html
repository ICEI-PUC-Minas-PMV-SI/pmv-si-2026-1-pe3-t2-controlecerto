<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administração — ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="../../styles/administracao.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <header class="page-header">
                <h1 class="page-header__title">Usuários Cadastrados</h1>
            </header>

            <section class="page-content" aria-label="Listagem de usuários">
                <div class="panel-table">
                    <table class="panel-table__table">
                        <thead>
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">CPF</th>
                                <th scope="col">E-mail</th>
                                <th scope="col">Cargo</th>
                                <th scope="col"><span class="visually-hidden">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-usuarios">
                        </tbody>
                    </table>
                </div>
            </section>

            <button type="button" class="fab" id="btn-adicionar" aria-label="Adicionar usuário">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
        </main>
    </div>

    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-cc">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalUsuarioTitulo">Novo Usuário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="usuario-id" />
                    <input type="text" id="usuario-nome" class="campo-modal mb-3" placeholder="Nome completo" />
                    <input type="text" id="usuario-cpf" class="campo-modal mb-3" placeholder="CPF (000.000.000-00)"
                        maxlength="14" />
                    <input type="email" id="usuario-email" class="campo-modal mb-3" placeholder="E-mail" />
                    <input type="password" id="usuario-senha" class="campo-modal mb-3" placeholder="Senha" />
                    <select id="usuario-cargo" class="campo-modal campo-select mb-3">
                        <option value="" disabled selected>Cargo</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Funcionário">Funcionário</option>
                    </select>
                    <p class="erro-modal" id="erro-modal"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-save" id="btn-salvar">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content modal-cc">
                <div class="modal-header">
                    <h5 class="modal-title">Excluir usuário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <p class="modal-confirm-text">Tem certeza que deseja excluir este usuário?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-delete" id="btn-confirmar-exclusao">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/sidebar.js"></script>
    <script src="../../scripts/db.js"></script>
    <script src="../../scripts/administracao.js"></script>
</body>

</html>
