<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios — ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="../../styles/relatorios.css" />
</head>

<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <header class="page-header">
                <h1 class="page-header__title">Relatórios</h1>
            </header>

            <div class="reports-toolbar" role="group" aria-label="Filtros do relatório">
                <label class="visually-hidden" for="periodo">Período</label>
                <select id="periodo" class="reports-toolbar__select" name="periodo">
                    <option value="">Todos os anos</option>
                </select>
                <label class="visually-hidden" for="tipo-relatorio">Tipo de Relatório</label>
                <select id="tipo-relatorio" class="reports-toolbar__select reports-toolbar__select--wide"
                    name="tipo-relatorio">
                    <option value="" selected>Tipo de Relatório</option>
                    <option value="fluxo">Fluxo de Caixa</option>
                    <option value="comparativo">Comparativo Mensal</option>
                </select>
                <button type="button" class="reports-toolbar__export">Exportar</button>
            </div>

            <section class="reports-summary" aria-label="Indicadores financeiros">
                <article class="finance-card">
                    <h2 class="finance-card__label">Receitas</h2>
                    <p class="finance-card__value finance-card__value--revenue" id="rel-receitas">R$ 0,00</p>
                </article>
                <article class="finance-card">
                    <h2 class="finance-card__label">Despesas</h2>
                    <p class="finance-card__value finance-card__value--expense" id="rel-despesas">R$ 0,00</p>
                </article>
                <article class="finance-card">
                    <h2 class="finance-card__label">Saldo</h2>
                    <p class="finance-card__value finance-card__value--balance" id="rel-saldo">R$ 0,00</p>
                </article>
                <article class="finance-card">
                    <h2 class="finance-card__label">Maior Gasto</h2>
                    <p class="finance-card__value finance-card__value--category" id="rel-maior-gasto">—</p>
                </article>
            </section>

            <article class="finance-card reports-chart-card" aria-label="Gráfico comparativo">
                <h2 class="finance-card__label" id="chart-titulo">Receitas / Despesas</h2>
                <div class="finance-card__chart">
                    <svg class="chart-dual-line" id="chart-relatorio" viewBox="0 0 900 200" role="img"
                        aria-label="Gráfico de linhas de receitas e despesas ao longo do ano">
                        <!-- preenchido via JS -->
                    </svg>
                </div>
            </article>

            <section class="reports-table panel-table" aria-label="Tabela comparativa por período">
                <table class="panel-table__table">
                    <thead>
                        <tr id="cabecalho-relatorio">
                            <th scope="col">Período</th>
                            <th scope="col">Receitas</th>
                            <th scope="col">Despesas</th>
                            <th scope="col">Saldo</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-relatorio"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/sidebar.js"></script>
    <script src="../../scripts/db.js"></script>
    <script src="../../scripts/relatorios.js"></script>
</body>

</html>
