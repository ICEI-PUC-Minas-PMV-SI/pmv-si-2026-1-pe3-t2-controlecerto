<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta — ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <script src="../scripts/db.js"></script>
    <script src="../scripts/cadastro.js"></script>
</head>

<body>
    <div class="container-fluid min-vh-100 align-items-center justify-content-center d-flex">
        <div class="login-container justify-content-center align-items-center d-flex">
            <div class="row w-100">
                <a href="index.html" class="navbar-brand justify-content-center d-flex">
                    <img src="../assets/imgs/logo.png" alt="ControleCerto" class="nav-logo" />
                </a>
                <div class="text-center">
                    <p class="login-header-text">Crie sua conta</p>
                </div>
                <div class="form">
                    <div class="form-group">
                        <input placeholder="Nome da Empresa" type="text" id="empresa" class="form-control" />
                        <input placeholder="Nome completo" type="text" id="nome" class="form-control" />
                        <input placeholder="E-mail" type="email" id="email" class="form-control" />
                        <input placeholder="Senha" type="password" id="senha" class="form-control" />
                        <input placeholder="Confirmar senha" type="password" id="confirmar-senha"
                            class="form-control" />
                    </div>
                    <p class="erro-login" id="erro"></p>
                    <button class="btn-login" onclick="fazerCadastro()">Criar Conta</button>
                    <a href="index.html" class="btn-voltar">Voltar ao Início</a>
                    <a href="login.html" class="btn-cadastro">Já tenho uma conta</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
