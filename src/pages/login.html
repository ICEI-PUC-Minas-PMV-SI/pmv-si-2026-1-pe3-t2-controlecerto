<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ControleCerto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <script src="../scripts/script.js"></script>
    <script src="../scripts/setup.js"></script>
</head>

<body>
    <div class="container-fluid min-vh-100 align-items-center justify-content-center d-flex">
        <div class="login-container justify-content-center align-items-center d-flex">
            <div class="row w-100">
                <a href="#" class="navbar-brand justify-content-center d-flex">
                    <img src="../assets/imgs/logo.png" alt="ControleCerto" class="nav-logo" />
                </a>
                <div class="text-center">
                    <p class="login-header-text">Entre com sua conta</p>
                </div>
                <div class="form">
                    <div class="form-group">
                        <input placeholder="E-mail" type="email" name="email" class="form-control" id="email">
                        <input placeholder="Senha" type="password" name="password" class="form-control" id="password">
                    </div>
                    <div class="d-flex w-100 align-items-center justify-content-end">
                        <a href="#" class="esqueci-senha-link">Esqueceu sua senha?</a>
                    </div>
                    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
                    <a href="index.html" class="btn-voltar">Voltar ao Início</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
